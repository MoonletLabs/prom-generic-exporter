name: Prometheus Generic Exporter Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        default: "minor"
        type: choice
        options:
          - major
          - minor
          - patch

# main is protected (changes only through pull requests), so the workflow never
# commits to it. The next version is derived from the latest GitHub release
# instead of the version stored in package.json.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2.1.0
        with:
          version: 8.6.0

      - name: Log in to Docker Hub
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Install dependencies
        run: pnpm install

      - name: Build
        id: build
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
          # ln -s $PWD/node_modules/.pnpm $PWD/packages/agent/node_modules/.pnpm
        run: |
          LATEST_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          npm version --commit-hooks false --git-tag-version false --allow-same-version "${LATEST_TAG##*-v}"
          npm version --commit-hooks false --git-tag-version false $INPUT_VERSION
          pnpm run build
          cd build
          pnpm install --prod
          pnpm add node-linux-x64@22
          chmod +x prom-generic-exporter
          VERSION=$(node -e "console.log(require('./package.json').version)")
          APP_NAME=$(node -e "console.log(require('./package.json').name)")
          cd ..
          mv build ${APP_NAME}-linux-x64-${VERSION}
          chmod -R +x ${APP_NAME}-linux-x64-${VERSION}
          tar -czvf ${APP_NAME}-linux-x64-${VERSION}.tar.gz ${APP_NAME}-linux-x64-${VERSION}

          pnpm run docker \
            --tag krisboit/prom-generic-exporter:latest \
            --tag krisboit/prom-generic-exporter:${VERSION}

          docker push krisboit/prom-generic-exporter:latest
          docker push krisboit/prom-generic-exporter:${VERSION}

          echo "APP_TAG=${APP_NAME}-v${VERSION}" >> $GITHUB_ENV

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.tar.gz"
          tag: ${{ env.APP_TAG }}
          overwrite: true
          file_glob: true
